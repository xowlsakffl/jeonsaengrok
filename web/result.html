<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ec">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="얼굴 관상과 생년월일, 성씨와 삶의 단서를 엮어 나만의 전생 이야기와 풀이를 읽어 보세요.">
  <title>전생록 — 전생 인물첩</title>
  <link rel="icon" href="./assets/seal.svg" type="image/svg+xml">
  <link rel="preload" as="font" href="./assets/myeongjo-bold.ttf" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./result.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap bar">
      <a class="brand" href="./#home" aria-label="전생록 처음으로"><img src="./assets/seal.svg" alt="" width="36" height="36"><span>전생록</span></a>
      <nav aria-label="주 메뉴">
        <a href="./#reading" class="nav-current" id="readingNav">전생 풀이</a>
        <button type="button" data-example>예시 기록</button>
        <button type="button" id="guideOpen">이용 안내</button>
      </nav>
    </div>
  </header>
  <main>
    <section id="resultView" hidden aria-labelledby="resultRole">
      <div class="result-wrap">
        <div class="record-tools"><button type="button" id="resultBack" class="text-button"><i data-icon="return"></i><span>입력으로 돌아가기</span></button></div>
        <article class="identity-card" aria-label="전생 인물첩"><div class="identity-frame">
          <img id="eraArt" class="era-panorama" alt="">
          <div class="identity-top"><p id="resultKind"></p><span class="ink-stamp" aria-hidden="true">前生</span></div>
          <div class="role-block"><p class="role-label">당신의 전생 직업</p><h1 id="resultRole" tabindex="-1"></h1><p id="storyQuote"></p></div>
          <dl class="identity-data"><div><dt>시대</dt><dd id="resultEra"></dd></div><div><dt>무대</dt><dd id="resultPlace"></dd></div></dl>
        </div></article>
        <div class="record-actions" role="group" aria-label="결과 저장과 공유">
          <button type="button" id="saveCard"><i data-icon="download"></i>카드 이미지 저장</button>
          <button type="button" id="saveRecord"><i data-icon="book"></i>전체 기록 이미지 저장</button>
          <button type="button" id="shareRecord"><i data-icon="share"></i>공유하기</button>
        </div>
        <p class="record-share-note">공유 링크를 받은 사람은 결말과 성격·재산 등 개인 풀이 근거까지 볼 수 있어요.</p>
        <p id="resultMessage" role="status"></p>
        <input id="manualCopy" type="text" readonly hidden aria-label="전체 기록 공유 링크">
        <article class="reading-paper">
          <h2 id="resultTitle"></h2><div id="sceneOpening" class="scene-prose"></div>
          <section id="dilemma" class="dilemma" aria-labelledby="dilemmaTitle" hidden>
            <h3 id="dilemmaTitle">지금의 나라면?</h3>
            <div id="sceneChoices" class="scene-choices"></div>
            <button type="button" id="skipChoice" class="skip-choice">선택하지 않고 결말 보기</button>
          </section>
          <div id="outcome" class="outcome" hidden>
            <dl id="sharedChoices" class="shared-choices" hidden></dl>
            <p id="comparison" class="comparison" tabindex="-1"></p>
            <section><h3>전생의 내가 한 선택</h3><div id="sceneDeed" class="scene-prose"></div><p id="habitEcho" class="habit-echo" hidden></p></section>
            <section><h3>그날 이후</h3><div id="sceneEnding" class="scene-prose"></div></section>
            <section id="keepsakeSection" hidden><h3 id="keepsakeTitle"></h3><div id="keepsakeText" class="scene-prose"></div></section>
            <details id="otherPath" class="other-path" hidden><summary>다른 선택을 했다면?</summary><div id="otherText" class="scene-prose"></div></details>
          </div>
        </article>
        <section id="fortuneCard" class="fortune-card" aria-labelledby="fortuneHeading" hidden>
          <span class="fortune-seal" aria-hidden="true">福</span><div><h2 id="fortuneHeading">이번 생에 돌아온 복</h2><p id="fortuneText"></p><div id="fortuneSource"></div></div>
        </section>
        <details id="explain" class="explain"><summary><i data-icon="scroll"></i>왜 이런 전생이 나왔을까?<span class="chevron"></span></summary><dl id="clues"></dl></details>
        <section class="history"><h2>기록과 창작 사이</h2><p id="historyText"></p><div id="sourceLinks"></div></section>
        <a class="archive-next" href="./records.html" target="_blank" rel="noopener noreferrer">다른 시대의 전생 이야기 읽기 <small>무료 · 새 탭에서 열기</small></a>
        <button type="button" id="again" class="primary wide">새 전생 풀이 시작</button>
      </div>
    </section>

    <section id="unavailableRecord" class="public-reading" hidden><h1>공유 기록을 열 수 없어요</h1><p>받은 링크가 끝까지 복사됐는지 확인해주세요.</p><a class="friend-start" href="./#reading">내 전생 풀이하기</a></section>
  </main>
  <template id="measurementDiagram">
    <svg viewBox="0 0 200 145" class="measurement-diagram" role="img" aria-label="측정 부위를 표시한 얼굴 도식">
      <g fill="none" stroke="#756c55" stroke-width="2" stroke-linecap="round">
        <path d="M64 57 Q61 11 100 11 Q139 11 136 57 Q137 93 120 117 Q108 132 100 133 Q92 132 80 117 Q63 93 64 57Z"/>
        <path d="M73 54 Q80 50 91 54 M109 54 Q119 50 127 54 M73 63 Q82 58 91 63 M109 63 Q118 58 127 63 M100 66 L96 82 Q101 86 106 82 M88 103 Q100 107 112 103"/>
      </g>
    </svg>
  </template>
  <template id="fortuneReference">
    <details class="clue-reference"><summary>‘복’이라는 풀이의 출처</summary>
      <p>초기 불교 경전 MN 135에는 수행자에게 음식과 옷을 베푼 사람이 인간으로 다시 태어날 때 재물이 풍족해진다는 가르침이 있습니다. 오늘의 직업·재산·집안 형편에서 이 인물이 무엇을 베풀었는지 떠올리는 부분은 전생록의 창작입니다.</p>
      <a href="https://www.dhammatalks.net/suttacentral/sc2016/sc/ko/mn135.html" target="_blank" rel="noopener noreferrer">MN 135 「업의 분별에 관한 짧은 설법」 한국어로 읽기</a>
    </details>
  </template>
  <template id="faceReference">
    <details class="clue-reference"><summary>관상 문헌과 사진 측정의 근거</summary>
      <p>『마의상법』 상권에서 코는 재물을 상징합니다. 원문에서 명궁은 두 눈썹 사이이고, 전생록이 재는 눈 간격은 양쪽 눈 안쪽 끝 사이의 거리입니다. 얼굴 너비 몇 퍼센트에 특정 전생을 배정하는 기준은 이 대목에 없습니다.</p>
      <a href="https://gongu.copyright.or.kr/webview/result/disk1/newdata/2014/97/CLS1/digi_9086064_0120140925.files/33.png" target="_blank" rel="noopener noreferrer">국회도서관 제공 『마의상법』 상권 33면 보기</a>
      <p>같은 사람의 사진을 여러 장 보여 줬을 때, 사진에 따라 첫인상 평가가 사람 사이의 차이만큼 크게 달라지기도 했습니다.</p>
      <a href="https://pubmed.ncbi.nlm.nih.gov/24866921/" target="_blank" rel="noopener noreferrer">토도로프·포터의 얼굴 사진 실험 읽기 (2014)</a>
    </details>
  </template>
  <footer class="footer"><div class="wrap"><a class="foot-brand" href="./#home">전생록 <span>前生錄</span></a><span>역사와 전통 관상에서 영감을 얻은 창작 이야기</span></div></footer>
</body>
</html>
