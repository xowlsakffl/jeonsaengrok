<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18382f">
  <meta name="robots" content="noindex">
  <title>이야기 집필 중 · 전생록</title>
  <link rel="icon" href="./assets/seal.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./loading.js"></script>
</head>
<body class="loading-page">
  <main id="writing" class="writing-view" aria-labelledby="writingTitle">
    <div class="writing-content">
      <div class="bound-book" aria-hidden="true"><span class="book-cord"></span><span class="book-slip">前生錄</span><img src="./assets/seal.svg" alt=""></div>
      <h1 id="writingTitle" tabindex="-1">전생록을 펼치는 중</h1>
      <p id="writingStatus" role="status">당신이 살았을 시대와 그날의 사연을 쓰고 있습니다.</p>
      <div class="ink-track" aria-hidden="true"></div>
      <button type="button" id="retryWriting" class="primary" hidden>다시 펼치기</button>
      <a id="freeRecords" class="free-records-link" href="./records.html" target="_blank" rel="noopener noreferrer" hidden>무료 전생 이야기 읽기 (새 탭)</a>
      <button type="button" id="stopWriting" class="text-button">입력으로 돌아가기</button>
    </div>
  </main>
</body>
</html>
